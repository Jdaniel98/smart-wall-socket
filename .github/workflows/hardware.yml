name: hardware

on:
  push:
    paths: ["hardware/**", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/**", ".github/workflows/hardware.yml"]
  workflow_dispatch:

jobs:
  verify:
    name: Schematic netlist and barrier checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install kicad-cli (KiCad 7 from the Ubuntu archive)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad python3-shapely
          kicad-cli version

      - name: Check schematics against the design data
        run: python3 hardware/tools/verify.py

      - name: Mechanical fit and zoning checks (params.py)
        run: python3 hardware/mech/params.py

      - name: Export schematic PDFs
        run: |
          mkdir -p ~/.config/kicad/7.0/colors out
          cp hardware/tools/kicad-theme-paper.json ~/.config/kicad/7.0/colors/paper.json
          for b in rear front; do
            kicad-cli sch export pdf -t paper -o out/sws-$b-schematic.pdf hardware/evt1/$b/sws-$b.kicad_sch
          done

      - uses: actions/upload-artifact@v4
        with:
          name: evt1-schematics
          path: out/
